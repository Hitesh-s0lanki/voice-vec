[project]
name = "voice-vec"
version = "0.1.0"
description = "Vec — a voice backend that hears twenty-two Indian languages and answers out loud in the one it heard, over whatever vector store its asker connected."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Hitesh Solanki" }]
keywords = [
    "voice",
    "speech-to-text",
    "text-to-speech",
    "sarvam",
    "rag",
    "retrieval-augmented-generation",
    "pgvector",
    "fastapi",
]
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    # Every provider call on the voice path is a streamed one; httpx is the
    # client that does that without buffering the whole body first.
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    # FastAPI needs this to read the multipart upload on /voice/transcribe.
    "python-multipart>=0.0.20",
    # Postgres + pgvector is the store (src/rag/store.py). `pgvector`
    # registers the vector type adapter; without it a numpy array binds as
    # an opaque blob and `<=>` fails to resolve.
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.2.3",
    # Clerk session tokens are RS256 JWTs, and the browser talks to this
    # server directly over the voice socket — so this is what proves a
    # `?token=` actually came from Clerk (src/core/clerk.py).
    "pyjwt[crypto]>=2.10.1",
    "uvicorn[standard]>=0.52.3",
    "composio>=0.20.0",
    # Agent memory (src/memory/store.py). Optional at runtime in exactly the
    # way the cache is — no AGENT_MEMORY_ENDPOINT means the agent keeps only
    # the history on the socket — but a hard dependency so a deployment that
    # *does* configure the service cannot silently get nothing because an
    # extra was never installed. Speakeasy-generated, httpx + pydantic only.
    "redis-agent-memory>=0.3.0",
    # The answer cache (src/rag/cache.py). Optional at runtime — no REDIS_URL
    # means no cache and every question runs the full path — but the client is
    # a hard dependency so that a deployment which *does* set the URL cannot
    # silently get exact-match caching because an extra was never installed.
    "redis>=5.2.0",
    # The agents (src/agents/, docs/21-agents.md). `langchain-openai` talks to
    # any OpenAI-compatible /chat/completions endpoint, which is the contract
    # `Settings.resolve_llm()` already assumed — OpenAI's API and Sarvam's both
    # satisfy it — so one client covers both providers. `langchain` itself is
    # here for `create_agent`: the dataset agent's write-run-repair loop is a
    # tool loop, and hand-rolling that loop is how a repair budget quietly
    # becomes unbounded. The streaming voice path (src/voice/llm.py) is not on
    # this: it needs token-level control of a socket that a listener is already
    # hearing, and an abstraction in the middle of that buys nothing.
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
